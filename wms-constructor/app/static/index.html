<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конструктор запросов LV_MERIDIAN</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">LV_MERIDIAN · Конструктор</div>
      <input id="menu-search" type="search" placeholder="Поиск по меню…" autocomplete="off">
      <nav id="menu" aria-label="Меню запросов"></nav>
    </aside>
    <main>
      <div id="tabs" role="tablist"></div>
      <div id="panels">
        <div id="welcome">
          <h2>Выберите запрос в меню слева</h2>
          <p>Каждый запрос открывается в новой вкладке. В каждой вкладке можно задать параметры, посмотреть таблицу и скачать её в Excel.</p>
        </div>
      </div>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
