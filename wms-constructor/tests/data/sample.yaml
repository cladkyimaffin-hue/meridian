section: sample
title: Пример (для тестов)
variables:
  zone:
    label: Зона
    type: multiselect
    options:
      - {value: A, label: "A — тест"}
  tovar:
    label: Товар
    type: text
queries:
  - id: sample.one
    title: "Пример: остатки"
    group: Тест
    kind: таблица
    description: Тестовый запрос, к базе не обращается.
    sql: |
      SELECT 1 AS [Удалить]
      FROM dbo.T t
      WHERE t.zone IN (:zone)
        AND (:tovar = N'' OR t.code LIKE N'%'+:tovar+N'%')
        AND t.created >= :date_from AND t.created < DATEADD(day, 1, :date_to)
        AND t.note <> N'12:30; UPDATE'
