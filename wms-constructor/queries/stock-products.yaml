section: stock-products
title: Остатки по товарам
source_dashboard: wms-stock-products
variables:
  zone:
    label: Зона
    type: multiselect
    options_sql: |
      SELECT z.zon_code AS __value, z.zon_code + N' — ' + z.zon_Description AS __text
      FROM dbo.LV_Zone z
      WHERE z.zon_ID IN (SELECT lzn_ZoneID
        FROM dbo.LV_LocZone) UNION SELECT N'-', N'- — Без зоны'
      ORDER BY 1
  tovar:
    label: Товар (код или часть названия)
    type: text
queries:
- id: stock-products.1-1
  title: 'Остатки: сводка'
  group: Обзор остатков
  kind: сводка
  description: |
    Что показывает: Сколько товаров лежит на складе, сколько строк остатка, занятых ячеек и контейнеров (с учётом фильтров).
    Как считается: по строкам LV_Stock; ячейка и контейнер считаются по разным значениям.
    Примечание: Одна строка остатка = товар в ячейке (и контейнере).
  sql: |
    SELECT COUNT(DISTINCT s.stk_ProductID) AS [Товаров на складе], COUNT(*) AS [Строк остатка], COUNT(DISTINCT s.stk_LocationID) AS [Занятых ячеек], COUNT(DISTINCT s.stk_ContainerID) AS [Контейнеров]
    FROM dbo.LV_Stock s
    JOIN dbo.LV_Location l ON l.loc_ID=s.stk_LocationID
    LEFT JOIN dbo.LV_LocZone lz ON lz.lzn_LocationID=l.loc_ID
    LEFT JOIN dbo.LV_Zone z ON z.zon_ID=lz.lzn_ZoneID
    LEFT JOIN dbo.LV_Product p ON p.prd_ID=s.stk_ProductID
    LEFT JOIN (SELECT prdl_ProductID AS pid, MAX(prdl_Description) AS d
      FROM dbo.LV_ProductLang
      GROUP BY prdl_ProductID) pn ON pn.pid=s.stk_ProductID
    LEFT JOIN dbo.LV_ItemUnit iu ON iu.itu_ID=s.stk_CUItemUnitID
    LEFT JOIN dbo.LV_Unit u ON u.unt_ID=iu.itu_UnitID
    LEFT JOIN dbo.LV_UnitLang ul ON ul.untl_UnitID=u.unt_ID AND ul.untl_LanguageID=4
    WHERE ISNULL(z.zon_code, N'-') IN (:zone) AND (:tovar=N'' OR p.prd_PrimaryCode LIKE N'%'+:tovar+N'%' OR pn.d LIKE N'%'+:tovar+N'%')
- id: stock-products.1-2
  title: Остатки по единицам измерения
  group: По единицам и зонам
  kind: таблица
  description: |
    Что показывает: Для каждой единицы: товаров, строк остатка, ячеек, количество, свободное и несвободное количество.
    Как считается: LV_Stock, единица из LV_ItemUnit → LV_Unit → LV_UnitLang (русский).
    Примечание: Количества разных единиц не складывать.
  sql: |
    SELECT ISNULL(ul.untl_Description, N'—') AS [Единица], COUNT(DISTINCT s.stk_ProductID) AS [Товаров], COUNT(*) AS [Строк остатка], COUNT(DISTINCT s.stk_LocationID) AS [Ячеек], SUM(s.stk_CUQuantity) AS [Количество], SUM(s.stk_CUQuantityFree) AS [Свободно], SUM(s.stk_CUQuantity - s.stk_CUQuantityFree) AS [Не свободно]
    FROM dbo.LV_Stock s
    JOIN dbo.LV_Location l ON l.loc_ID=s.stk_LocationID
    LEFT JOIN dbo.LV_LocZone lz ON lz.lzn_LocationID=l.loc_ID
    LEFT JOIN dbo.LV_Zone z ON z.zon_ID=lz.lzn_ZoneID
    LEFT JOIN dbo.LV_Product p ON p.prd_ID=s.stk_ProductID
    LEFT JOIN (SELECT prdl_ProductID AS pid, MAX(prdl_Description) AS d
      FROM dbo.LV_ProductLang
      GROUP BY prdl_ProductID) pn ON pn.pid=s.stk_ProductID
    LEFT JOIN dbo.LV_ItemUnit iu ON iu.itu_ID=s.stk_CUItemUnitID
    LEFT JOIN dbo.LV_Unit u ON u.unt_ID=iu.itu_UnitID
    LEFT JOIN dbo.LV_UnitLang ul ON ul.untl_UnitID=u.unt_ID AND ul.untl_LanguageID=4
    WHERE ISNULL(z.zon_code, N'-') IN (:zone) AND (:tovar=N'' OR p.prd_PrimaryCode LIKE N'%'+:tovar+N'%' OR pn.d LIKE N'%'+:tovar+N'%')
    GROUP BY ul.untl_Description
    ORDER BY COUNT(*) DESC
- id: stock-products.1-3
  title: Остатки по зонам и единицам
  group: По единицам и зонам
  kind: таблица
  description: |
    Что показывает: В каждой зоне и единице: товаров, строк остатка, ячеек, количество и свободное количество.
    Как считается: LV_Stock, зона ячейки из LV_LocZone.
    Примечание: Остатки в ячейках без зоны показаны как «Без зоны».
  sql: |
    SELECT ISNULL(z.zon_Description, N'Без зоны') AS [Зона], ISNULL(ul.untl_Description, N'—') AS [Единица], COUNT(DISTINCT s.stk_ProductID) AS [Товаров], COUNT(*) AS [Строк остатка], COUNT(DISTINCT s.stk_LocationID) AS [Ячеек], SUM(s.stk_CUQuantity) AS [Количество], SUM(s.stk_CUQuantityFree) AS [Свободно]
    FROM dbo.LV_Stock s
    JOIN dbo.LV_Location l ON l.loc_ID=s.stk_LocationID
    LEFT JOIN dbo.LV_LocZone lz ON lz.lzn_LocationID=l.loc_ID
    LEFT JOIN dbo.LV_Zone z ON z.zon_ID=lz.lzn_ZoneID
    LEFT JOIN dbo.LV_Product p ON p.prd_ID=s.stk_ProductID
    LEFT JOIN (SELECT prdl_ProductID AS pid, MAX(prdl_Description) AS d
      FROM dbo.LV_ProductLang
      GROUP BY prdl_ProductID) pn ON pn.pid=s.stk_ProductID
    LEFT JOIN dbo.LV_ItemUnit iu ON iu.itu_ID=s.stk_CUItemUnitID
    LEFT JOIN dbo.LV_Unit u ON u.unt_ID=iu.itu_UnitID
    LEFT JOIN dbo.LV_UnitLang ul ON ul.untl_UnitID=u.unt_ID AND ul.untl_LanguageID=4
    WHERE ISNULL(z.zon_code, N'-') IN (:zone) AND (:tovar=N'' OR p.prd_PrimaryCode LIKE N'%'+:tovar+N'%' OR pn.d LIKE N'%'+:tovar+N'%')
    GROUP BY z.zon_Description, ul.untl_Description
    ORDER BY z.zon_Description, COUNT(*) DESC
- id: stock-products.1-4
  title: 'Товары: сколько и где'
  group: По товарам
  kind: таблица
  description: |
    Что показывает: Каждый товар на складе: в скольких ячейках и контейнерах лежит, сколько всего, свободно и не свободно.
    Как считается: LV_Stock по товару и единице; TOP 100, сначала товары в большем числе ячеек.
    Примечание: Для поиска конкретного товара введите код или часть названия в фильтре «Товар».
  sql: |
    SELECT TOP 100 ISNULL(p.prd_PrimaryCode, N'—') AS [Код товара], LEFT(ISNULL(pn.d, N'—'), 70) AS [Название товара], ISNULL(ul.untl_Description, N'—') AS [Единица], COUNT(DISTINCT s.stk_LocationID) AS [Ячеек], COUNT(DISTINCT s.stk_ContainerID) AS [Контейнеров], SUM(s.stk_CUQuantity) AS [Количество], SUM(s.stk_CUQuantityFree) AS [Свободно], SUM(s.stk_CUQuantity - s.stk_CUQuantityFree) AS [Не свободно]
    FROM dbo.LV_Stock s
    JOIN dbo.LV_Location l ON l.loc_ID=s.stk_LocationID
    LEFT JOIN dbo.LV_LocZone lz ON lz.lzn_LocationID=l.loc_ID
    LEFT JOIN dbo.LV_Zone z ON z.zon_ID=lz.lzn_ZoneID
    LEFT JOIN dbo.LV_Product p ON p.prd_ID=s.stk_ProductID
    LEFT JOIN (SELECT prdl_ProductID AS pid, MAX(prdl_Description) AS d
      FROM dbo.LV_ProductLang
      GROUP BY prdl_ProductID) pn ON pn.pid=s.stk_ProductID
    LEFT JOIN dbo.LV_ItemUnit iu ON iu.itu_ID=s.stk_CUItemUnitID
    LEFT JOIN dbo.LV_Unit u ON u.unt_ID=iu.itu_UnitID
    LEFT JOIN dbo.LV_UnitLang ul ON ul.untl_UnitID=u.unt_ID AND ul.untl_LanguageID=4
    WHERE ISNULL(z.zon_code, N'-') IN (:zone) AND (:tovar=N'' OR p.prd_PrimaryCode LIKE N'%'+:tovar+N'%' OR pn.d LIKE N'%'+:tovar+N'%')
    GROUP BY s.stk_ProductID, p.prd_PrimaryCode, pn.d, ul.untl_Description
    ORDER BY COUNT(DISTINCT s.stk_LocationID) DESC, p.prd_PrimaryCode
- id: stock-products.1-5
  title: Товары в нескольких ячейках
  group: По товарам
  kind: таблица
  description: |
    Что показывает: Товары, которые лежат больше чем в одной ячейке: число ячеек и общее количество.
    Как считается: LV_Stock, товары с двумя и более ячейками; TOP 50 по числу ячеек.
    Примечание: Помогает увидеть, где товар разбросан по складу.
  sql: |
    SELECT TOP 50 ISNULL(p.prd_PrimaryCode, N'—') AS [Код товара], LEFT(ISNULL(pn.d, N'—'), 70) AS [Название товара], ISNULL(ul.untl_Description, N'—') AS [Единица], COUNT(DISTINCT s.stk_LocationID) AS [Ячеек], SUM(s.stk_CUQuantity) AS [Количество]
    FROM dbo.LV_Stock s
    JOIN dbo.LV_Location l ON l.loc_ID=s.stk_LocationID
    LEFT JOIN dbo.LV_LocZone lz ON lz.lzn_LocationID=l.loc_ID
    LEFT JOIN dbo.LV_Zone z ON z.zon_ID=lz.lzn_ZoneID
    LEFT JOIN dbo.LV_Product p ON p.prd_ID=s.stk_ProductID
    LEFT JOIN (SELECT prdl_ProductID AS pid, MAX(prdl_Description) AS d
      FROM dbo.LV_ProductLang
      GROUP BY prdl_ProductID) pn ON pn.pid=s.stk_ProductID
    LEFT JOIN dbo.LV_ItemUnit iu ON iu.itu_ID=s.stk_CUItemUnitID
    LEFT JOIN dbo.LV_Unit u ON u.unt_ID=iu.itu_UnitID
    LEFT JOIN dbo.LV_UnitLang ul ON ul.untl_UnitID=u.unt_ID AND ul.untl_LanguageID=4
    WHERE ISNULL(z.zon_code, N'-') IN (:zone) AND (:tovar=N'' OR p.prd_PrimaryCode LIKE N'%'+:tovar+N'%' OR pn.d LIKE N'%'+:tovar+N'%')
    GROUP BY s.stk_ProductID, p.prd_PrimaryCode, pn.d, ul.untl_Description
    HAVING COUNT(DISTINCT s.stk_LocationID)>1
    ORDER BY COUNT(DISTINCT s.stk_LocationID) DESC, p.prd_PrimaryCode
- id: stock-products.1-6
  title: Остатки по ячейкам
  group: Где лежит товар
  kind: таблица
  description: |
    Что показывает: Строки остатков: ячейка, зона, контейнер (SSCC), товар, единица, количество, свободно, не свободно, дата поступления контейнера и причины резерва и непригодности.
    Как считается: LV_Stock с ячейкой, контейнером и справочниками причин; до 500 строк по коду ячейки.
    Примечание: Чтобы увидеть, где лежит нужный товар, введите его код или часть названия в фильтре «Товар».
  sql: |
    SELECT TOP 500 l.loc_Code AS [Ячейка], ISNULL(z.zon_Description, N'Без зоны') AS [Зона], ISNULL(sc.stc_SSCC, N'—') AS [Контейнер (SSCC)], ISNULL(p.prd_PrimaryCode, N'—') AS [Код товара], LEFT(ISNULL(pn.d, N'—'), 70) AS [Название товара], ISNULL(ul.untl_Description, N'—') AS [Единица], s.stk_CUQuantity AS [Количество], s.stk_CUQuantityFree AS [Свободно], s.stk_CUQuantity - s.stk_CUQuantityFree AS [Не свободно], ISNULL(CONVERT(varchar(10), sc.stc_EntryDate, 120), N'—') AS [Контейнер поступил], ISNULL(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE((rr.srr_Description COLLATE Cyrillic_General_CS_AS), N'ЗанЯта', N'Занята'), N'ИнвентаризациЯ', N'Инвентаризация'), N'ТехнологическаЯ', N'Технологическая'), N'ХозЯйственные', N'Хозяйственные'), N'хранениЯ', N'хранения'), N'—') AS [Причина резерва], ISNULL(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE((ur.unr_Description COLLATE Cyrillic_General_CS_AS), N'ЗанЯта', N'Занята'), N'ИнвентаризациЯ', N'Инвентаризация'), N'ТехнологическаЯ', N'Технологическая'), N'ХозЯйственные', N'Хозяйственные'), N'хранениЯ', N'хранения'), N'—') AS [Причина непригодности]
    FROM dbo.LV_Stock s
    JOIN dbo.LV_Location l ON l.loc_ID=s.stk_LocationID
    LEFT JOIN dbo.LV_LocZone lz ON lz.lzn_LocationID=l.loc_ID
    LEFT JOIN dbo.LV_Zone z ON z.zon_ID=lz.lzn_ZoneID
    LEFT JOIN dbo.LV_Product p ON p.prd_ID=s.stk_ProductID
    LEFT JOIN (SELECT prdl_ProductID AS pid, MAX(prdl_Description) AS d
      FROM dbo.LV_ProductLang
      GROUP BY prdl_ProductID) pn ON pn.pid=s.stk_ProductID
    LEFT JOIN dbo.LV_ItemUnit iu ON iu.itu_ID=s.stk_CUItemUnitID
    LEFT JOIN dbo.LV_Unit u ON u.unt_ID=iu.itu_UnitID
    LEFT JOIN dbo.LV_UnitLang ul ON ul.untl_UnitID=u.unt_ID AND ul.untl_LanguageID=4
    LEFT JOIN dbo.LV_StockContainer sc ON sc.stc_ID=s.stk_ContainerID
    LEFT JOIN dbo.LV_StockReserveReason rr ON rr.srr_ID=s.stk_ReserveReasonID
    LEFT JOIN dbo.LV_UnsuitabilityReason ur ON ur.unr_ID=s.stk_UnsuitReasonID
    WHERE ISNULL(z.zon_code, N'-') IN (:zone) AND (:tovar=N'' OR p.prd_PrimaryCode LIKE N'%'+:tovar+N'%' OR pn.d LIKE N'%'+:tovar+N'%')
    ORDER BY l.loc_Code, p.prd_PrimaryCode
